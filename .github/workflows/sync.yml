# Keeps marketplace.json and icons/ in step with the latest release of every connector.
name: Sync connectors

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  # A connector repo can trigger an immediate sync after publishing a release:
  #   gh api repos/jhonsu01/marketplace-SunsamCode/dispatches -f event_type=connector-release
  repository_dispatch:
    types: [connector-release]
  push:
    branches: [main]
    paths: [sources.json, scripts/sync.mjs]

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync from connector releases
        run: node scripts/sync.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain marketplace.json icons)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add marketplace.json icons
            git commit -m "sync: $(node -p "require('./marketplace.json').connectors.map(c => c.name.replace('-mcp-server','') + '@' + c.version).join(', ')")"
            git push
          else
            echo "No changes"
          fi
